name: Weekly public updates
on:
  schedule:
    - cron: '30 12 * * 0' # Sunday 20:30 Asia/Shanghai (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/weekly-updates.yml
permissions:
  contents: read
concurrency:
  group: profile-public-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify update behavior
        run: python -m unittest discover -s tests -v
      - name: Read public sources and render updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit only changed generated content
        run: |
          git add README.md README.zh-CN.md UPDATES.md data/updates.json
          if git diff --cached --quiet; then
            echo "No new content; skipping commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: refresh public project updates"
          git push origin HEAD:main
