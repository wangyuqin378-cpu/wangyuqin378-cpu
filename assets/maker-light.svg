<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
<title id="title">Yuqin Wang — Small apps. Real life.</title><desc id="desc">Original illustration: a photo observation card, a folded city map, and a task bookmark connected by one line. Apps for everyday life and tools for working with AI.</desc>
<style>text{font-family:'Avenir Next',Avenir,'Trebuchet MS',Arial,sans-serif;fill:#17384A}.small{font-size:16px;letter-spacing:2px;font-weight:600}.muted{fill:#486271}.line{stroke:#17384A;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="960" height="358" rx="20" fill="#E6EFF4"/>
<!-- A continuous observation line joins a photo, a city walk and a saved task. -->
<path d="M526 291 C558 302 558 239 612 240 S697 285 729 232 S798 143 858 177 S896 292 855 313" stroke="#C44832" stroke-width="3" fill="none" stroke-linecap="round"/>
